[package]
name = "oas"
description = "OpenAPI models with JSON Schema 2020-12 and streaming media type support"
version = "0.3.0"
edition = "2021"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
# Retain formerly opaque schema keywords while exposing losslessly typed values.
# Cargo feature unification applies this policy to every consumer of this crate.
lossless-schema-keywords = []

[dependencies]
either = "1.8.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = "2.2.0"

[dev-dependencies]
assert-json-diff = "2.0.2"
