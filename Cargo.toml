[package]
name = "oas"
description = "OpenAPI models with JSON Schema 2020-12 and streaming media type support"
version = "0.4.1-dev"
edition = "2021"
license = "MIT"
repository = "https://github.com/Kilerd/oas"
documentation = "https://docs.rs/oas/0.4.1-dev/oas/"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
lossless-schema-keywords = []

[dependencies]
either = "1.8.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = "2.2.0"

[dev-dependencies]
assert-json-diff = "2.0.2"
